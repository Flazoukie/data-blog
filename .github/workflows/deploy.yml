name: Deploy Quarto Blog

on:
  push:
    branches: [main]       # Runs when anything is pushed to main
  workflow_dispatch:       # Allows manual site rebuilds if needed

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # Required to push gh-pages pages

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Publish to GitHub Pages
        uses: quarto-dev/quarto-actions/publish@v2
        with:
          target: gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
