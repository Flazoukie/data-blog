name: Deploy Quarto Blog

on:
  push:
    branches: [main]       # Trigger on push to main
  workflow_dispatch:       # Manual trigger

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Needed to push commits
          token: ${{ secrets.BLOG_REPO_TOKEN }}  # Use PAT with push permissions

      - name: Setup Quarto
        uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render

      - name: Commit and push changes
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add docs/
          git diff --cached --quiet || git commit -m "Update site with latest posts"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.BLOG_REPO_TOKEN }}

